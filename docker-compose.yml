
services:
  # Authentication Database
  auth-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=auth_service
      - POSTGRES_USER=auth_user
      - POSTGRES_PASSWORD=auth_pass
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres/init-auth.sql:/docker-entrypoint-initdb.d/init-auth.sql
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - opareta-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Payment Database
  payment-db:
    image: postgres:15-alpine  # CHANGED from 14 to 15
    environment:
      - POSTGRES_DB=payment_service
      - POSTGRES_USER=payment_user
      - POSTGRES_PASSWORD=payment_pass
    ports:
      - "5434:5432"
    volumes:
      - ./data/postgres/init-payment.sql:/docker-entrypoint-initdb.d/init-payment.sql
      - payment_db_data:/var/lib/postgresql/data
    networks:
      - opareta-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - opareta-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Authentication Service
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://auth_user:auth_pass@auth-db:5432/auth_service
      - JWT_SECRET=RBbGBiJJLiOpai3un5ZYlu4FQ/pGNsK7kdwv2lI42EP6lL9B2+Bxa+a46M8lv/Qz
      - JWT_EXPIRES_IN=1h
      - PORT=3001
      - TYPEORM_SYNCHRONIZE=true  # KEEP THIS - it's for NestJS/TypeORM to sync entities
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - opareta-network
    # REMOVED: deploy section with replicas to avoid port conflicts
    restart: unless-stopped

  # Payment Service
  payment-service:
    build:
      context: ./services/payment
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://payment_user:payment_pass@payment-db:5432/payment_service
      - AUTH_SERVICE_URL=http://auth-service:3001
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=RBbGBiJJLiOpai3un5ZYlu4FQ/pGNsK7kdwv2lI42EP6lL9B2+Bxa+a46M8lv/Qz
      - PORT=3002
      - TYPEORM_SYNCHRONIZE=true  # KEEP THIS - it's for NestJS/TypeORM to sync entities
    depends_on:
      payment-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opareta-network
    # REMOVED: deploy section with replicas to avoid port conflicts
    restart: unless-stopped

  # Nginx
  nginx:
    image: nginx:1.21-alpine
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/conf.d:/etc/nginx/conf.d
      - ./config/ssl:/etc/nginx/ssl
    depends_on:
      - auth-service
      - payment-service
    networks:
      - opareta-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - opareta-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - opareta-network

  # Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    networks:
      - opareta-network

  # Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_BASE=http://localhost:8080
    depends_on:
      - nginx
    networks:
      - opareta-network

volumes:
  auth_db_data:
  payment_db_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  opareta-network:
    driver: bridge