server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;
    limit_req zone=api_limit burst=20 nodelay;

    # Frontend - serve static files
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health endpoint
    location /health {
        proxy_pass http://auth-service:3001/auth/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth service - handle with and without trailing slash
    location ~ ^/auth/?(.*)$ {
        proxy_pass http://auth-service:3001/auth/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Payment service - handle with and without trailing slash
    location ~ ^/payments/?(.*)$ {
        proxy_pass http://payment-service:3002/payments/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhooks - handle with and without trailing slash
    location ~ ^/webhooks/?(.*)$ {
        proxy_pass http://payment-service:3002/webhooks/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name localhost;
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;
    ssl_certificate /etc/nginx/ssl/opareta.crt;
    ssl_certificate_key /etc/nginx/ssl/opareta.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    limit_req zone=api_limit burst=20 nodelay;

    # Frontend - serve static files
    location / {
